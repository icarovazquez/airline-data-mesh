name: maintenance_daily
version: 1
owner: Maintenance
source: SYNTHETIC. Generated by airline_mesh.synthetic from the real flight schedule and stated assumptions.
sensitivity: public (no real aircraft status)
freshness: matches the flights loaded
path: maintenance/maintenance_daily.parquet
join_keys: [day]
columns:
  day: {type: date}
  fleet_size: {type: integer, note: distinct aircraft in the flight data}
  aircraft_out_of_service: {type: integer}
  open_defects: {type: integer}
