name: crew_daily
version: 1
owner: Crew scheduling
source: SYNTHETIC. Generated by airline_mesh.synthetic from the real flight schedule and stated assumptions.
sensitivity: public (no real people; aggregate counts per base per day)
freshness: matches the flights loaded
path: crew/crew_daily.parquet
join_keys: [base, day]
columns:
  day: {type: date}
  base: {type: string, note: airport code, matches flights.origin}
  departures: {type: integer, note: flights scheduled to depart the base, cancelled included}
  crews_needed: {type: integer, note: crews required to cover the departures}
  crews_rostered: {type: integer, note: crews assigned to the base, including reserve}
  reserve_pool: {type: integer, note: reserve crews within the roster}
  crews_available: {type: integer, note: rostered crews able to work that day}
  reserve_used: {type: integer, note: reserve crews called on to cover regular crews}
  avg_duty_hours: {type: number, unit: hours}
